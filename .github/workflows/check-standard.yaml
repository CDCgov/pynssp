# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

name: pynssp Pipeline

permissions:
  contents: read

jobs:
  test:
    name: test with ${{ matrix.py }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Sphinx>=8 in requirements_dev.txt requires Python >= 3.10.
        py:
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup python ${{ matrix.py }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
          cache: pip
          cache-dependency-path: requirements_dev.txt
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Run test suite
        run: tox -e py
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
          CI_RUN: "yes"

  check:
    name: lint and package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python "3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --upgrade pip flake8 build twine
      # Full flake8 style checks currently report >1000 findings, so only gate on real errors.
      - name: Lint (syntax errors and undefined names)
        run: flake8 pynssp tests --select=E9,F63,F7,F82 --show-source
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*

